<?xml version="1.0" encoding="UTF-8"?>
<!-- Hey Codex icon master: a monochrome wake signal, deliberately distinct
     from both the system microphone indicator and the upstream mascot. -->
<svg width="1000" height="1000" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- pure-black squircle tile -->
  <rect x="0" y="0" width="1000" height="1000" rx="224" ry="224" fill="#000000"/>

  <!-- A compact wake signal: a central spark with three expanding arcs.
       It reads as "a signal was heard," never as microphone hardware. -->
  <g fill="none" stroke="#f3f2ef" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="500" cy="500" r="46" fill="#f3f2ef" stroke="none"/>
    <path d="M398 398c-56 56-56 148 0 204" stroke-width="50"/>
    <path d="M602 398c56 56 56 148 0 204" stroke-width="50"/>
    <path d="M306 306c-107 107-107 281 0 388" stroke-width="50"/>
    <path d="M694 306c107 107 107 281 0 388" stroke-width="50"/>
    <path d="M500 248v-58M500 810v-58M248 500h-58M810 500h-58" stroke-width="34"/>
  </g>
</svg>
