<?xml version="1.0" encoding="UTF-8"?>
<!-- README banner, drawn rather than generated so the wordmark is spelled right
     and the mark is the real shipping app icon. -->
<svg width="1280" height="480" viewBox="0 0 1280 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="vignette" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#0e1418"/>
      <stop offset="100%" stop-color="#05070a"/>
    </radialGradient>
    <radialGradient id="tealHaze" cx="80%" cy="48%" r="34%">
      <stop offset="0%" stop-color="#2fd4c4" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#2fd4c4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberHaze" cx="20%" cy="50%" r="30%">
      <stop offset="0%" stop-color="#f5a352" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#f5a352" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f7a94f"/>
      <stop offset="42%" stop-color="#d99a63"/>
      <stop offset="100%" stop-color="#35d6c6"/>
    </linearGradient>
    <filter id="glowSoft" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="glowTight" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <rect width="1280" height="480" fill="url(#vignette)"/>
  <rect width="1280" height="480" fill="url(#tealHaze)"/>
  <rect width="1280" height="480" fill="url(#amberHaze)"/>

  <!-- Faint drifting motes, for depth rather than decoration. -->
  <g fill="#7fe3d8" opacity="0.5">
    <circle cx="392" cy="128" r="1.6"/><circle cx="527" cy="96" r="1.2"/>
    <circle cx="700" cy="150" r="1.4"/><circle cx="861" cy="112" r="1.1"/>
    <circle cx="962" cy="352" r="1.5"/><circle cx="612" cy="372" r="1.2"/>
    <circle cx="470" cy="318" r="1.3"/><circle cx="1108" cy="300" r="1.2"/>
    <circle cx="255" cy="366" r="1.1"/><circle cx="800" cy="392" r="1.3"/>
  </g>

  <!-- The spoken phrase. -->
  <g>
    <g filter="url(#glowSoft)" opacity="0.55">
      <rect x="104" y="182" width="300" height="96" rx="30" fill="none" stroke="#f7a94f" stroke-width="3"/>
    </g>
    <rect x="104" y="182" width="300" height="96" rx="30" fill="#0a0d11" stroke="#f7a94f" stroke-width="2.2"/>
    <path d="M138 278 L118 330 L186 278 Z" fill="#0a0d11" stroke="#f7a94f" stroke-width="2.2" stroke-linejoin="round"/>
    <rect x="140" y="276" width="42" height="6" fill="#0a0d11"/>
    <text x="150" y="245" font-family="SF Pro Display, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="42" font-weight="600" fill="#f9b972">Hey Codex</text>
  </g>

  <!-- Voice travelling across the machine to the listener. -->
  <g fill="none" stroke="url(#stream)" stroke-linecap="round">
    <g filter="url(#glowSoft)" opacity="0.4">
      <path d="M404 214 C 560 150, 640 316, 792 300 S 900 236, 968 232" stroke-width="6"/>
    </g>
    <path d="M404 214 C 560 150, 640 316, 792 300 S 900 236, 968 232" stroke-width="2.6" opacity="0.95"/>
    <path d="M404 236 C 566 182, 648 346, 800 328 S 908 258, 972 250" stroke-width="1.8" opacity="0.6"/>
    <path d="M410 256 C 574 214, 656 374, 808 356 S 916 280, 976 266" stroke-width="1.4" opacity="0.38"/>
  </g>

  <!-- Hey Codex wakes. The mark is the real app icon. -->
  <g transform="translate(1058,232)">
    <circle r="86" fill="#2fd4c4" opacity="0.09"/>
    <g filter="url(#glowTight)" opacity="0.8">
      <circle r="70" fill="none" stroke="#35d6c6" stroke-width="2.4"/>
    </g>
    <circle r="70" fill="none" stroke="#4fe0d1" stroke-width="1.8"/>
    <rect x="-42" y="-42" width="84" height="84" rx="21" fill="#000000"/>
    <g transform="scale(0.068) translate(-500,-500)">
      <g fill="none" stroke="#f3f2ef" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="500" cy="500" r="46" fill="#f3f2ef" stroke="none"/>
        <path d="M398 398c-56 56-56 148 0 204" stroke-width="50"/>
        <path d="M602 398c56 56 56 148 0 204" stroke-width="50"/>
        <path d="M306 306c-107 107-107 281 0 388" stroke-width="50"/>
        <path d="M694 306c107 107 107 281 0 388" stroke-width="50"/>
        <path d="M500 248v-58M500 810v-58M248 500h-58M810 500h-58" stroke-width="34"/>
      </g>
    </g>
  </g>

  <text x="640" y="428" text-anchor="middle"
        font-family="SF Pro Text, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="26" font-weight="500" fill="#dfe4e8">ChatGPT Voice, hands free, from anywhere on your Mac.</text>
</svg>
