<?xml version="1.0" encoding="UTF-8"?>
<!-- README banner. Built from the real app icon rather than generated art, so
     the mark, the wordmark and the wake phrase are all exactly right. -->
<svg width="1280" height="560" viewBox="0 0 1280 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16161d"/>
      <stop offset="50%" stop-color="#0e0e13"/>
      <stop offset="100%" stop-color="#1a1420"/>
    </linearGradient>
    <radialGradient id="warm" cx="82%" cy="36%" r="46%">
      <stop offset="0%" stop-color="#ff9d5c" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ff9d5c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd9a8" stop-opacity="0.5"/>
      <stop offset="45%" stop-color="#ff9d5c" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ff9d5c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbBody" cx="38%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="42%" stop-color="#ffe3bd"/>
      <stop offset="100%" stop-color="#ff9a55"/>
    </radialGradient>
    <linearGradient id="waveFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5ad7c8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffb277" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1280" height="560" fill="url(#bg)"/>
  <rect width="1280" height="560" fill="url(#warm)"/>

  <!-- Menu bar strip: the app lives up here, out of the way. -->
  <g>
    <rect x="0" y="0" width="1280" height="38" fill="#000000" opacity="0.5"/>
    <g fill="#7c7c86">
      <rect x="34" y="16" width="52" height="6" rx="3"/>
      <rect x="104" y="16" width="34" height="6" rx="3"/>
      <rect x="156" y="16" width="40" height="6" rx="3"/>
      <rect x="1084" y="16" width="30" height="6" rx="3"/>
      <rect x="1218" y="16" width="30" height="6" rx="3"/>
    </g>
    <!-- The real mark, sitting in the menu bar where it actually lives. -->
    <g transform="translate(1160,19) scale(0.03) translate(-500,-500)">
      <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="500" cy="500" r="46" fill="#ffffff" stroke="none"/>
        <path d="M398 398c-56 56-56 148 0 204" stroke-width="50"/>
        <path d="M602 398c56 56 56 148 0 204" stroke-width="50"/>
        <path d="M306 306c-107 107-107 281 0 388" stroke-width="50"/>
        <path d="M694 306c107 107 107 281 0 388" stroke-width="50"/>
        <path d="M500 248v-58M500 810v-58M248 500h-58M810 500h-58" stroke-width="34"/>
      </g>
    </g>
  </g>

  <!-- You speak. -->
  <g transform="translate(104,122)">
    <rect x="0" y="0" width="392" height="118" rx="40" fill="#20202a" stroke="#35353f" stroke-width="2"/>
    <path d="M70 118 L64 160 L118 118 Z" fill="#20202a"/>
    <text x="44" y="76" font-family="SF Pro Display, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="50" font-weight="700" fill="#f4f4f6">“Hey Codex”</text>
  </g>

  <!-- It carries across the machine. -->
  <g fill="none" stroke="url(#waveFade)" stroke-linecap="round">
    <path d="M528 176 C 632 176, 632 142, 736 142 S 840 210, 944 176" stroke-width="7" opacity="0.8"/>
    <path d="M528 206 C 636 206, 636 248, 744 248 S 852 172, 952 206" stroke-width="4" opacity="0.38"/>
  </g>

  <!-- Voice wakes up. -->
  <g transform="translate(1042,192)">
    <circle r="164" fill="url(#orbGlow)"/>
    <circle r="126" fill="none" stroke="#ffb277" stroke-width="1.5" opacity="0.2"/>
    <circle r="94" fill="none" stroke="#ffb277" stroke-width="1.5" opacity="0.3"/>
    <circle r="64" fill="url(#orbBody)" filter="url(#soft)" opacity="0.85"/>
    <circle r="54" fill="url(#orbBody)"/>
  </g>

  <!-- Brand row: the actual app icon, at a size you can see. -->
  <g transform="translate(104,368)">
    <g>
      <rect x="0" y="0" width="104" height="104" rx="24" fill="#000000"/>
      <g transform="translate(52,52) scale(0.082) translate(-500,-500)">
        <g fill="none" stroke="#f3f2ef" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="500" cy="500" r="46" fill="#f3f2ef" stroke="none"/>
          <path d="M398 398c-56 56-56 148 0 204" stroke-width="50"/>
          <path d="M602 398c56 56 56 148 0 204" stroke-width="50"/>
          <path d="M306 306c-107 107-107 281 0 388" stroke-width="50"/>
          <path d="M694 306c107 107 107 281 0 388" stroke-width="50"/>
          <path d="M500 248v-58M500 810v-58M248 500h-58M810 500h-58" stroke-width="34"/>
        </g>
      </g>
    </g>
    <text x="132" y="46" font-family="SF Pro Display, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="60" font-weight="800" fill="#ffffff" letter-spacing="-1.4">Hey Codex</text>
    <text x="136" y="88" font-family="SF Pro Text, -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="25" font-weight="500" fill="#a3a3ae">ChatGPT Voice, hands free, from anywhere on your Mac.</text>
  </g>
</svg>
