name: Validate Hey Codex

# This workflow validates source changes only. It never creates releases,
# uploads artifacts, signs, notarizes, modifies an appcast, or pushes commits.
# Publishing is deliberately a separate, explicit maintainer decision.

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch local speech dependencies
        run: |
          ./scripts/fetch-sherpa.sh
          ./scripts/fetch-models.sh

      - name: Build and test
        run: |
          swift build --product HeyCodexApp -c release
          swift test
